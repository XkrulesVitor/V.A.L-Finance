services:
  - type: cron
    name: ia-trading-cron
    runtime: python
    # O plano `free` NAO existe para cron job. A propria API do Render
    # recusa: "invalid plan: free. valid PaidPlans are [starter, standard,
    # pro, ...]". Web service tem free tier; cron job nao tem. Starter e o
    # piso, ~US$ 7/mes.
    plan: starter
    # De hora em hora, e nao a cada 15 min. Os candles sao de 1h e
    # `somente_fechados` descarta o que ainda esta aberto -- entao rodar 4x
    # por hora grava 4 linhas com exatamente as mesmas features, e 3 delas
    # sao lixo. O cron so tem o que fazer quando um candle fecha.
    schedule: "5 * * * *"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/main.py"
    envVars:
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      # O Supabase renomeou o formato das chaves: o painel novo entrega
      # SUPABASE_SECRET_KEY (sb_secret_...), projetos antigos tem
      # SUPABASE_SERVICE_ROLE_KEY (JWT longo). O codigo aceita as duas --
      # preencha no painel do Render a que o seu Supabase mostrar.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # O cron job ainda NAO chama o cerebro -- por isso nao ha chave de
      # LLM aqui. Ela entra no passo 8, quando main.py passar a compor
      # cerebro + Risk Engine.
