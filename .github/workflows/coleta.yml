name: Coleta e indicadores (cron)

# ATENCAO ao mexer na fonte de dados: a Binance responde HTTP 451 para o
# IP do runner (medido: Phoenix/EUA). Tanto `api.binance.com` quanto
# `testnet.binance.vision` sao bloqueados. So `data-api.binance.vision`
# passa -- e e o que o adapter usa em modo `somente_dados_publicos`.
# Trocar isso por qualquer endpoint autenticado quebra este workflow.
#
# Substitui o Render como executor do backend/main.py. O Render exige um
# plano pago (starter, ~US$ 7/mes) para cron job -- o free tier so cobre
# web service. GitHub Actions e de graca ate 2.000 minutos/mes no plano
# free, e este job leva segundos, entao nunca chega perto do limite.
#
# Cadencia horaria, nos 5 minutos de cada hora: os candles sao de 1h e
# `somente_fechados` descarta o que ainda esta aberto, entao rodar mais
# vezes por hora so gravaria a mesma feature repetida. Ver render.yaml
# para o raciocinio completo -- este arquivo espelha a mesma cadencia.
#
# `workflow_dispatch` permite disparar manualmente pela aba Actions, sem
# esperar a proxima hora -- util pra testar depois de qualquer mudanca.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      # Sem chave da Binance de proposito: o ciclo so le dados publicos
      # (preco e candles), e o endpoint `data-api.binance.vision` nao pede
      # autenticacao. Menos segredo em transito e menos coisa pra vazar.
      - name: Rodar o ciclo de coleta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python backend/main.py
