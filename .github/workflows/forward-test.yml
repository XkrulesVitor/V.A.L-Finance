name: Forward test (6 carteiras)

# A estrategia decidindo ao vivo, com preenchimento simulado ao preco
# real de mercado. Nao envia ordem pra corretora nenhuma.
#
# MEDICAO INICIADA EM 2026-09-04, com as duas contas em 10.000 e a
# tabela `portfolio` vazia. Antes de ligar o agendamento foram feitas
# duas execucoes manuais: uma com --ensaio (conferindo secrets, Supabase
# e o proprio YAML) e uma real (conferindo que a chamada ao Gemini
# funciona do runner). As duas passaram.
#
# O criterio de leitura do resultado foi fixado ANTES disto, na secao 11
# do ARCHITECTURE.md. Mexer nele depois de ver o numero seria
# interpretacao conveniente, entao ele nao se mexe.
#
# TROCA DE ESTRATEGIA EM 2026-09-22 (decidida em 2026-09-19): de la pra ca quem decide e a regra
# de tendencia diaria, sem LLM na decisao. Criterio de leitura: ARCHITECTURE.md,
# secao 11, "Troca do motor ao vivo".
#
# SEIS CARTEIRAS (setembro/2026): o mesmo job roda T1 Reguas, T2 Tartarugas,
# T3 Conselho de IAs, G1 Reguas com meta, G2 Repique e G3 Conselho com meta
# (backend/live/carteiras.py; pre-registro em
# backend/backtest/PRE_REGISTRO_6_CARTEIRAS.md). 100% GRATUITO:
# - o painel de IAs usa o Gemini direto (cota gratis; o projeto do Google NAO
#   pode ter conta de faturamento) e modelos ":free" do OpenRouter -- o codigo
#   recusa id sem ":free";
# - ANTHROPIC_API_KEY e LLM_PROVEDOR SAIRAM daqui de proposito: o provedor
#   "claude" e pago, e o explicador agora pede o Gemini pelo nome.
#
# Aos :10 e nao aos :05 pra nao concorrer com o workflow de coleta --
# duas execucoes simultaneas gravando na mesma tabela nao quebrariam
# nada (o indice unico protege), mas o log fica mais facil de ler.
#
# A cadencia e horaria porque o stop precisa ser conferido toda hora. A
# regra de tendencia so muda de ideia uma vez por dia (fechamento UTC),
# mas descobrir um stop com um dia de atraso nao e aceitavel.
#
# QUEM DISPARA E O SUPABASE, NAO O GITHUB (outubro/2026): o pg_cron chama
# o `workflow_dispatch` aos :10, com os inputs no default. O `schedule`
# saiu pelo mesmo motivo do workflow de coleta -- ver o comentario la.
#
# Sobre a Binance: o ciclo usa `somente_dados_publicos`, entao sai pelo
# `data-api.binance.vision`. Os outros endpoints respondem 451 pro IP do
# runner. Nao troque isso sem reler o workflow de coleta.
on:
  workflow_dispatch:
    inputs:
      pares:
        description: "Pares, separados por espaco"
        default: "BTCUSDT ETHUSDT XRPUSDT LINKUSDT ADAUSDT DOGEUSDT"
      ensaio:
        description: "So mostrar o estado, sem decidir nem gravar"
        type: boolean
        default: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    # O rodar.py tem prazo proprio de 13 min (o painel para aos 11): o job
    # nunca e morto no meio de uma escrita.
    timeout-minutes: 15
    # Impede que dois ciclos rodem ao mesmo tempo. O indice unico ja
    # garante que o mesmo candle nao seja decidido duas vezes, mas
    # serializar aqui evita gastar cota de LLM numa corrida perdida.
    concurrency:
      group: forward-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      # Sem chave da Binance: o ciclo so le dados publicos. As chaves de IA
      # sao as do painel (Gemini + OpenRouter) e do explicador (Gemini).
      - name: Rodar o ciclo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python backend/live/rodar.py \
            --pares ${{ github.event.inputs.pares || 'BTCUSDT ETHUSDT XRPUSDT LINKUSDT ADAUSDT DOGEUSDT' }} \
            ${{ github.event.inputs.ensaio == 'true' && '--ensaio' || '' }}
